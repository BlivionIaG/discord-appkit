name: emit-fetchcord
on:
  workflow_dispatch:
jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: appkit import-ids catalog/fetchcord-testing && appkit emit --format fetchcord-testing --out /tmp/fetchcord-resources
      - run: find /tmp/fetchcord-resources -type f
