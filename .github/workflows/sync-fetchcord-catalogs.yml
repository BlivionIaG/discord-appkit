name: sync-fetchcord-catalogs

# Opens a pull request on the public FetchCord repo with emitted catalogs.
# Uses a GitHub token only. Does not read DISCORD_USER_TOKEN.
on:
  workflow_dispatch:
    inputs:
      fetchcord_ref:
        description: FetchCord branch to branch from
        type: string
        default: testing

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: checkout FetchCord
        env:
          FETCHCORD_SYNC_TOKEN: ${{ secrets.FETCHCORD_SYNC_TOKEN }}
        run: |
          set +x
          if [ -z "$FETCHCORD_SYNC_TOKEN" ]; then
            echo "FETCHCORD_SYNC_TOKEN is not set"
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer ${FETCHCORD_SYNC_TOKEN}" \
            clone --depth 1 --branch "${{ inputs.fetchcord_ref }}" \
            https://github.com/fetchcord/FetchCord.git /tmp/FetchCord

      - name: emit and merge catalogs
        run: |
          appkit emit --format fetchcord-testing \
            --out /tmp/FetchCord/fetch_cord/resources \
            --merge
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/FetchCord/fetch_cord/resources")
          for name in ("os.json", "cpus.json", "terminal.json", "motherboards.json"):
              data = json.loads((root / name).read_text(encoding="utf-8"))
              bad = [key for key in data if not str(key).isdigit()]
              if bad:
                  raise SystemExit(f"{name} has non-application keys: {bad[:5]}")
          print("catalogs ok")
          PY

      - name: open pull request
        env:
          FETCHCORD_SYNC_TOKEN: ${{ secrets.FETCHCORD_SYNC_TOKEN }}
          BASE: ${{ inputs.fetchcord_ref }}
        run: |
          set +x
          branch="appkit/catalog-sync-${GITHUB_RUN_ID}"
          git -C /tmp/FetchCord config user.name "discord-appkit"
          git -C /tmp/FetchCord config user.email "appkit@users.noreply.github.com"
          git -C /tmp/FetchCord checkout -b "$branch"
          git -C /tmp/FetchCord add fetch_cord/resources
          if git -C /tmp/FetchCord diff --cached --quiet; then
            echo "no catalog changes"
            exit 0
          fi
          git -C /tmp/FetchCord commit -m "chore: sync Discord application catalogs from appkit"
          git -c "http.extraheader=AUTHORIZATION: bearer ${FETCHCORD_SYNC_TOKEN}" \
            -C /tmp/FetchCord push https://github.com/fetchcord/FetchCord.git "HEAD:refs/heads/${branch}"
          BRANCH="$branch" python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              "title": "chore: sync Discord application catalogs",
              "head": os.environ["BRANCH"],
              "base": os.environ["BASE"],
              "body": "Generated by discord-appkit. Application IDs only. No tokens.",
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/fetchcord/FetchCord/pulls",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['FETCHCORD_SYNC_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              payload = json.loads(resp.read().decode())
          url = payload.get("html_url")
          if not url:
              raise SystemExit("pull request was not created")
          print(url)
          PY
